<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kylin Secure OS Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-base-200 min-h-screen">

    <!-- ===== Top Nav ===== -->
    <div class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30 px-4">
      <div class="navbar-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center">
          <span class="text-lg">🛡️</span>
        </div>
        <div>
          <p class="text-[9px] tracking-widest text-primary font-bold uppercase leading-none">Kylin OS · Software Cup A2</p>
          <h1 class="text-base font-bold text-base-content leading-tight">安全智能运维 Agent</h1>
        </div>
      </div>
      <div class="navbar-end gap-2">
        <span id="healthPill" class="badge badge-warning badge-sm gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-warning animate-pulse"></span> 连接中
        </span>
        <span id="brainPill" class="badge badge-outline badge-sm">Brain ?</span>
        <span id="sandboxPill" class="badge badge-warning badge-sm gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-warning animate-pulse"></span> Sandbox
        </span>
      </div>
    </div>

    <!-- ===== Main Grid ===== -->
    <main class="p-3 md:p-4 max-w-[1680px] mx-auto">
      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr_340px] gap-3 md:gap-4">

        <!-- ============ Left Panel — 任务输入 ============ -->
        <div class="card bg-base-100 shadow-xl h-fit lg:sticky lg:top-20">
          <div class="card-body p-4">
            <h2 class="card-title text-sm font-bold">📟 任务输入</h2>

            <!-- Composer -->
            <form id="chatForm" class="mt-2 space-y-2">
              <textarea id="messageInput"
                class=" textarea textarea-bordered textarea-sm w-full text-sm leading-relaxed resize-none font-sans"
                rows="3"
                placeholder="例：帮我分析最近的系统报错…"></textarea>
              <button id="sendBtn" type="submit"
                class="btn btn-primary btn-sm w-full gap-1.5 font-bold">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3 2l18 10L3 22l3-10zm0 0h8"/>
                </svg>
                运行诊断
              </button>
            </form>

            <!-- Samples -->
            <div class="divider my-3 text-xs text-base-content/40">演示场景</div>
            <div id="sampleBar" class="grid grid-cols-2 gap-1.5"></div>

            <!-- Messages -->
            <div class="divider my-3 text-xs text-base-content/40 flex items-center justify-between">
              <span>对话记录</span>
              <button id="clearBtn" class="text-xs text-base-content/50 hover:text-primary">＋ 新会话</button>
            </div>
            <div id="messages" class="space-y-2 min-h-[180px] max-h-[340px] overflow-y-auto pr-1"></div>
          </div>
        </div>

        <!-- ============ Center Panel — Agent 输出 ============ -->
        <div class="card bg-base-100 shadow-xl">
          <div class="card-body p-4">
            <!-- Header -->
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <h2 class="card-title text-sm font-bold">🤖 Agent 输出</h2>
                <p id="requestId" class="font-mono text-[10px] text-base-content/40 mt-0.5">未开始</p>
              </div>
              <span id="riskBadge" class="badge badge-success badge-lg font-bold">LOW</span>
            </div>

            <!-- Answer -->
            <div class="rounded-xl bg-base-200 border border-base-300 p-4">
              <p class="text-[9px] font-bold tracking-widest uppercase text-base-content/40 mb-2">结论</p>
              <pre id="answer" class="text-sm leading-relaxed text-base-content/80 whitespace-pre-wrap font-sans">暂无结果</pre>
            </div>

            <!-- Trace timeline -->
            <p class="text-[10px] font-bold tracking-widest uppercase text-base-content/40 mt-4 mb-2">执行链路</p>
            <div id="trace" class="min-h-[180px] flex items-center justify-center bg-base-200/40
                        border border-dashed border-base-300 rounded-xl text-base-content/40">
              等待任务
            </div>
          </div>
        </div>

        <!-- ============ Right Panel — 安全与沙盒 ============ -->
        <div class="space-y-3">

          <!-- Security card -->
          <div class="card bg-base-100 shadow-xl">
            <div class="card-body p-4">
              <div class="flex items-start justify-between gap-2">
                <h2 class="card-title text-sm font-bold">🔒 安全与沙盒</h2>
              </div>
              <p id="sandboxLine" class="text-[10px] text-base-content/50 mt-0.5">检测中…</p>

              <!-- 3-column stats -->
              <div class="grid grid-cols-3 gap-2 mt-3">
                <div class="stat bg-base-200 rounded-xl p-2 text-center">
                  <div class="stat-title text-[9px] text-base-content/40">自动</div>
                  <div id="autoToolCount" class="stat-value text-lg text-success">0</div>
                </div>
                <div class="stat bg-base-200 rounded-xl p-2 text-center">
                  <div class="stat-title text-[9px] text-base-content/40">需确认</div>
                  <div id="confirmToolCount" class="stat-value text-lg text-warning">0</div>
                </div>
                <div class="stat bg-base-200 rounded-xl p-2 text-center">
                  <div class="stat-title text-[9px] text-base-content/40">禁止</div>
                  <div id="denyToolCount" class="stat-value text-lg text-error">0</div>
                </div>
              </div>

              <!-- Guard -->
              <p class="text-[10px] font-bold tracking-widest uppercase text-base-content/40 mt-4 mb-1">安全事件</p>
              <div id="guardReasons" class="text-xs text-base-content/50 bg-base-200 rounded-lg p-2 min-h-[40px]">
                暂无安全事件
              </div>

              <!-- Tool calls -->
              <p class="text-[10px] font-bold tracking-widest uppercase text-base-content/40 mt-3 mb-1">工具调用</p>
              <div id="toolCalls" class="text-xs bg-base-200 rounded-lg p-2 min-h-[40px]">
                暂无工具调用
              </div>
            </div>
          </div>

          <!-- Tool policies card -->
          <div class="card bg-base-100 shadow-xl">
            <div class="card-body p-4">
              <h2 class="card-title text-sm font-bold">🛠️ 工具权限</h2>
              <div id="toolPolicies" class="mt-2 text-xs">加载中</div>
            </div>
          </div>

          <!-- Audit log card -->
          <div class="card bg-base-100 shadow-xl">
            <div class="card-body p-4 flex flex-col max-h-[300px]">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-sm font-bold">📋 审计日志</h2>
                <button id="refreshAuditBtn" class="btn btn-ghost btn-xs">↻</button>
              </div>
              <div id="auditList" class="mt-2 min-h-[50px] text-xs overflow-y-auto space-y-1">暂无审计记录</div>
            </div>
          </div>

        </div>

      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
