# Milvus Standalone — RAG 生产依赖。
#
# 三组件：
#   milvus    : Milvus Standalone（向量引擎，含 dense + BM25 sparse + RRF 混合检索）
#   etcd      : Milvus 元数据存储
#   minio     : Milvus 对象存储（索引 / 向量数据持久化）
#
# 启动：  docker compose up -d
# 验证：  docker compose ps
# 连接 URI：http://127.0.0.1:19530（应用侧 MILVUS_URI）
#
# Docker Desktop 已安装（v29.6.2），Compose v5.3.1。
# 生产部署配置；应用侧通过 MILVUS_URI=http://127.0.0.1:19530 连接。

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    # v2.6.21：与 pymilvus 3.0 兼容，且 RRF reranker（Function RERANK）要求 Milvus 2.6+。
    image: milvusdb/milvus:v2.6.21
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"   # gRPC（pymilvus 默认）
      - "9091:9091"     # HTTP / health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

volumes:
  etcd-data:
  minio-data:
  milvus-data:
