[pytest]
# 默认排除真实 API smoke（需显式 -m real_embedding -s 或 -m real_chat -s 运行）。
# 避免 CI 因密钥/网络缺失失败；real smoke 不使用 Fake 或 SVD 冒充真实成功。
markers =
    real_embedding: 调用真实 Embedding API（读取根目录 .env，未配置则 skip；绝不输出 api_key）
    real_chat: 调用真实 Chat API 执行只读 ReAct 链路（需 APP_V4_USE_FAKE_MODEL=false）
    integration: 真实嵌入式 Milvus Lite 端到端测试（BM25 + dense + RRF）；默认排除，需显式 -m integration 运行
    real_mcp_e2e: MCP 单一生产路径真实 E2E（启动独立 FastMCP HTTP Server → /api/chat → 真实 disk_usage）；默认排除
addopts = -m "not real_embedding and not real_chat and not integration and not real_mcp_e2e" --basetemp=pytest-tmp-appv4
testpaths = app_v4/tests
